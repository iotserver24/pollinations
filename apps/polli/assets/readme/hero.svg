<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" aria-labelledby="title desc" role="img" viewBox="0 0 1200 360"><title id="title">Polli, a Discord and GitHub engineering assistant</title><desc id="desc">A restrained banner showing Discord, GitHub, and API inputs flowing through Polli to research and engineering tools.</desc><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1}.ink{fill:#172033}.muted{fill:#526077}.line{fill:none;stroke:#64748b;stroke-width:3;stroke-linecap:round}.accent{fill:#4f46e5}.warm{fill:#f4b942}.label{font:600 18px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.small{font:500 15px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.wordmark{font:750 64px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;letter-spacing:-2px}.tagline{font:500 24px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}@media (prefers-color-scheme:dark){.bg{fill:#0f172a}.panel{fill:#172033;stroke:#475569}.ink{fill:#f1f5f9}.muted{fill:#b7c2d4}.line{stroke:#94a3b8}.accent{fill:#818cf8}.warm{fill:#f6c453}}</style><rect width="1200" height="360" class="bg" rx="28"/><g opacity=".55"><path d="M72 68h140M988 292h140M1090 68h38M72 292h38" class="line"/><circle cx="72" cy="68" r="6" class="accent"/><circle cx="1128" cy="292" r="6" class="warm"/></g><text x="92" y="160" class="wordmark ink">Polli</text><text x="94" y="204" class="tagline muted">Engineering context, where the conversation happens.</text><text x="94" y="247" class="small muted">Discord · GitHub · OpenAI-compatible API</text><path d="M695 94h82M695 180h82M695 266h82" class="line"/><circle cx="777" cy="94" r="5" class="accent"/><circle cx="777" cy="180" r="5" class="accent"/><circle cx="777" cy="266" r="5" class="accent"/><g transform="translate(592 61)"><rect width="150" height="66" class="panel" rx="13"/><circle cx="25" cy="33" r="10" c